# Attic Cloud on one Docker host: control plane, one VM node, agent daemon, MCP server, Postgres, optional Ollama.
#
# Quick start (from this directory; details in deploy/README.md):
#   1. echo 'ATTIC_POSTGRES_PASSWORD=<any local password>' > .env
#      printf 'ATTIC_UID=%s\nATTIC_GID=%s\n' "$(id -u)" "$(id -g)" >> .env   # lets vmd/agentd read the private keys
#   2. generate keys:  go run ../cmd/atticctl key generate -out keys -id admin   (also: -id agentd, -id vmd)
#   3. docker compose up -d --build
#   4. docker compose --profile llm up -d     # optional: Ollama for agentd
#
# Isolation knobs (all optional, set in .env or the shell): run next to other Docker projects without clashing.
#   COMPOSE_PROJECT_NAME   prefix of every container, network and volume (default: the directory name, "deploy")
#   ATTIC_BIND             host address the ports are published on (default 127.0.0.1)
#   ATTIC_VMD_PORT / ATTIC_AGENTD_PORT / ATTIC_MCP_PORT / ATTIC_OLLAMA_PORT   host ports (8080 / 8081 / 8082 / 11434)
#   ATTIC_UID / ATTIC_GID  user the vmd and agentd containers run as; it must be able to read keys/*.key, which
#                          atticctl writes with mode 0600 (default 65532, the image's nonroot user)
#   ATTIC_MCP_BIND         host address of the MCP port only (default: ATTIC_BIND); 0.0.0.0 to serve other machines
#   ATTIC_MCP_TLS_DIR / ATTIC_MCP_TLS_CERT / ATTIC_MCP_TLS_KEY   serve MCP over HTTPS: host folder with the files,
#                          and their paths under /tls (for example /tls/cert.pem and /tls/key.pem); the files must be
#                          readable by ATTIC_UID
#   OLLAMA_MODELS_DIR      host folder of Ollama models for docker-compose.gpu.yml (default ~/.ollama/models)
#   ATTIC_MAX_TOKEN_TTL    longest token lifetime vmd, agentd and mcp accept (default 720h); keep it equal on all three
#   ATTIC_SUBNET           subnet of the private network (default 172.30.77.0/24)
#   ATTIC_NODE_CPUS / ATTIC_NODE_MEM   hard caps for the node container, which hosts the guests (default 4 / 6g)
#   ATTIC_IMAGES_DIR       host folder with guest base images, mounted read-only at /images in the node (default ./images)
#
# Secrets come from the environment via ${VAR} substitution; nothing secret is written in this file.
# Keys are mounted read-only from ./keys. Each service gets only the key files it needs.

name: ${COMPOSE_PROJECT_NAME:-attic}

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17
    environment:
      POSTGRES_USER: attic
      POSTGRES_DB: attic
      # Required: compose fails fast if ATTIC_POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${ATTIC_POSTGRES_PASSWORD:?set ATTIC_POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-agentd.sql:ro   # creates the agentd database
    networks: [attic]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attic -d attic"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Control plane: API, scheduler, state in Postgres. It calls the node over the private network.
  vmd:
    <<: *restart
    user: "${ATTIC_UID:-65532}:${ATTIC_GID:-65532}"
    build:
      context: ..       # the repository root, so the Dockerfile sees go.work and every module
      dockerfile: deploy/Dockerfile.vmd
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # vmd reads the DSN from this variable so the password never appears on the command line.
      ATTIC_POSTGRES_DSN: postgres://attic:${ATTIC_POSTGRES_PASSWORD:?set ATTIC_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/attic?sslmode=disable
    command:
      - --role=control
      - --listen=:8080
      - --node=node1=http://node:8080                  # id=URL of the VM node below
      - --service-key=/keys/vmd.key                    # signs the tokens vmd uses to call the node
      - --service-key-id=vmd
      - --trusted-key=admin=/keys/admin.pub            # user tokens
      - --trusted-key=agentd=/keys/agentd.pub:service  # agentd may only ever act with the "service" role
      - --max-token-ttl=${ATTIC_MAX_TOKEN_TTL:-720h}
      - --log-level=info
      - --metrics=true
    volumes:
      - ./keys/admin.pub:/keys/admin.pub:ro
      - ./keys/agentd.pub:/keys/agentd.pub:ro
      - ./keys/vmd.key:/keys/vmd.key:ro
    networks: [attic]
    ports:
      - "${ATTIC_BIND:-127.0.0.1}:${ATTIC_VMD_PORT:-8080}:8080"

  # VM node: runs QEMU/KVM guests. Needs /dev/kvm; NET_ADMIN is for the guest firewall inside this container's own
  # network namespace only (it never touches the host's rules).
  node:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    command:
      - --listen=:8080
      - --node-id=node1
      - --data-dir=/var/lib/attic
      - --ssh-key=/var/lib/attic/node_ssh              # created on first start; its public half goes into cloud-init
      - --run-as=qemu
      - --trusted-key=vmd=/keys/vmd.pub:node           # only the control plane's key, and only the "node" role
      - --allow-dns=127.0.0.11                         # Docker's embedded resolver: guests get DNS, nothing else on loopback
      - --reserve-memory-mb=${ATTIC_NODE_RESERVE_MB:-1024}
      - --log-level=info
    devices:
      - /dev/kvm:/dev/kvm
    cap_add:
      - NET_ADMIN
    cpus: ${ATTIC_NODE_CPUS:-4}
    mem_limit: ${ATTIC_NODE_MEM:-6g}
    volumes:
      - nodedata:/var/lib/attic
      - ${ATTIC_IMAGES_DIR:-./images}:/images:ro
      - ./keys/vmd.pub:/keys/vmd.pub:ro
    networks: [attic]

  agentd:
    <<: *restart
    user: "${ATTIC_UID:-65532}:${ATTIC_GID:-65532}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agentd
    depends_on:
      postgres:
        condition: service_healthy
      vmd:
        condition: service_started
    environment:
      ATTIC_POSTGRES_DSN: postgres://attic:${ATTIC_POSTGRES_PASSWORD:?set ATTIC_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/agentd?sslmode=disable
    command:
      - --listen=:8080
      - --trusted-key=admin=/keys/admin.pub
      - --vmd-url=http://vmd:8080
      - --ollama-url=${ATTIC_OLLAMA_URL:-http://ollama:11434}
      - --service-key=/keys/agentd.key
      - --service-key-id=agentd
      - --workers=4
      - --max-token-ttl=${ATTIC_MAX_TOKEN_TTL:-720h}
      - --log-level=info
      - --metrics=true
    volumes:
      - ./keys/admin.pub:/keys/admin.pub:ro
      - ./keys/agentd.key:/keys/agentd.key:ro
    networks: [attic]
    ports:
      - "${ATTIC_BIND:-127.0.0.1}:${ATTIC_AGENTD_PORT:-8081}:8080"

  # MCP server for Claude and other MCP clients. Callers send the same bearer tokens vmd and agentd accept; the
  # server forwards them, so it can do nothing its caller could not. Put TLS in front of it for anything but loopback.
  mcp:
    <<: *restart
    user: "${ATTIC_UID:-65532}:${ATTIC_GID:-65532}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mcp
    depends_on:
      vmd:
        condition: service_started
      agentd:
        condition: service_started
    command:
      - --listen=:8082
      - --trusted-key=admin=/keys/admin.pub
      - --vmd-url=http://vmd:8080
      - --agentd-url=http://agentd:8080
      - --default-project=${ATTIC_DEFAULT_PROJECT:-default}
      - --default-image=${ATTIC_DEFAULT_IMAGE:-}
      - --max-token-ttl=${ATTIC_MAX_TOKEN_TTL:-720h}
      - --tls-cert=${ATTIC_MCP_TLS_CERT:-}   # empty = plain HTTP; set both TLS variables to serve HTTPS
      - --tls-key=${ATTIC_MCP_TLS_KEY:-}
      - --log-level=info
    volumes:
      - ./keys/admin.pub:/keys/admin.pub:ro
      - ${ATTIC_MCP_TLS_DIR:-./keys}:/tls:ro  # holds the certificate and key named by the two variables above
    networks: [attic]
    ports:
      - "${ATTIC_MCP_BIND:-${ATTIC_BIND:-127.0.0.1}}:${ATTIC_MCP_PORT:-8082}:8082"

  # Optional LLM server on the CPU (no GPU reservation). Start it with: docker compose --profile llm up -d
  # For the GPU and the host's existing models use the override: -f docker-compose.yml -f docker-compose.gpu.yml.
  ollama:
    profiles: ["llm"]
    <<: *restart
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    networks: [attic]
    ports:
      - "${ATTIC_BIND:-127.0.0.1}:${ATTIC_OLLAMA_PORT:-11434}:11434"

networks:
  attic:
    ipam:
      config:
        - subnet: ${ATTIC_SUBNET:-172.30.77.0/24}

volumes:
  pgdata:
  nodedata:
  ollama:
