# Local development stack for homecloud.
#
# Usage (from the deploy/ directory):
#   1. Create deploy/.env with at least:
#        HOMECLOUD_POSTGRES_PASSWORD=<any local dev password>
#   2. Generate keys (see deploy/README.md) into deploy/keys/.
#   3. docker compose up -d --build           # core stack
#      docker compose --profile llm up -d     # also start ollama for agentd
#
# Keys are mounted read-only from ./keys. Only public keys go to vmd; agentd gets its private key.
# Secrets come from the environment via ${VAR} substitution. Nothing secret is written in this file.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: homecloud
      POSTGRES_DB: homecloud
      # Required: compose fails fast if HOMECLOUD_POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${HOMECLOUD_POSTGRES_PASSWORD:?set HOMECLOUD_POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-agentd.sql:ro   # creates the agentd database
    ports:
      # Bound to loopback so the database is reachable from the host for debugging only.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecloud -d homecloud"]
      interval: 2s
      timeout: 3s
      retries: 30

  vmd:
    build:
      # The build context is the repository root so the Dockerfile can see go.work, the module directories and ./services.
      context: ..
      dockerfile: deploy/Dockerfile.vmd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # vmd reads the DSN from this variable so the password never appears on the command line.
      HOMECLOUD_POSTGRES_DSN: postgres://homecloud:${HOMECLOUD_POSTGRES_PASSWORD:?set HOMECLOUD_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/homecloud?sslmode=disable
    command:
      # --listen:           address for the Connect API inside the container.
      # --role=all:         run control plane and node in one process (dev only; see deploy/README.md).
      # --trusted-key:      kid=path[:roles]. Repeatable. The admin key may grant any role; the
      #                     agentd key may only grant the "service" role, so it cannot mint admin tokens.
      # --max-token-ttl:    longest lifetime vmd accepts on a token.
      # --log-level:        debug, info, warn or error.
      # --metrics:          expose Prometheus metrics on the API listener.
      # --data-dir:         local state for the node role (disk images, guest work files).
      # --ssh-key:          key vmd uses to reach guests (created on first start, public half goes into cloud-init).
      # --no-firewall, --kvm=false, --run-as=: this container has no iptables rights, no /dev/kvm and no
      #                     separate VM user, so guests cannot actually boot here. The stack is for exercising the
      #                     APIs; run a real node (deploy/README.md) to boot VMs.
      - --listen=:8080
      - --role=all
      - --ssh-key=/var/lib/homecloud/node_ssh
      - --no-firewall
      - --kvm=false
      - --run-as=
      - --trusted-key=admin=/keys/admin.pub
      - --trusted-key=agentd=/keys/agentd.pub:service
      - --max-token-ttl=720h
      - --log-level=info
      - --metrics=true
      - --data-dir=/var/lib/homecloud
    volumes:
      - ./keys:/keys:ro
      - vmddata:/var/lib/homecloud
    ports:
      - "127.0.0.1:8080:8080"

  agentd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agentd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vmd:
        # The images have no healthcheck, so this only waits for the container to start.
        condition: service_started
      ollama:
        # Optional: when the "llm" profile is not enabled, agentd starts without ollama.
        condition: service_started
        required: false
    environment:
      HOMECLOUD_POSTGRES_DSN: postgres://homecloud:${HOMECLOUD_POSTGRES_PASSWORD:?set HOMECLOUD_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/agentd?sslmode=disable
    command:
      # --trusted-key:    kid=path public key to accept user tokens from (the same admin key vmd trusts).
      # --vmd-url:        where agentd calls the vmd Connect API (compose network name).
      # --ollama-url:     LLM endpoint for task execution.
      # --service-key:    private key agentd signs its service tokens with (mounted read-only).
      # --service-key-id: kid that matches the --trusted-key entry on vmd.
      # --workers:        concurrent task workers.
      # --listen, --log-level, --metrics: as for vmd.
      - --listen=:8080
      - --trusted-key=admin=/keys/admin.pub
      - --vmd-url=http://vmd:8080
      - --ollama-url=http://ollama:11434
      - --service-key=/keys/agentd.key
      - --service-key-id=agentd
      - --workers=4
      - --log-level=info
      - --metrics=true
    volumes:
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:8081:8080"

  mcp:
    # MCP server for Claude and other MCP clients. Callers send the same bearer tokens vmd and agentd accept; the
    # server forwards them, so it can do nothing its caller could not. Put TLS in front of it (or pass --tls-cert/--tls-key).
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mcp
    restart: unless-stopped
    depends_on:
      vmd:
        condition: service_started
      agentd:
        condition: service_started
    command:
      # --vmd-url / --agentd-url: the Connect APIs this server calls (compose network names).
      # --default-project:        project used when a tool call names none.
      # --default-image:          image (name or ID) agent_create boots from when none is given.
      # --trusted-key:            same public key(s) vmd and agentd trust, to authenticate MCP callers.
      - --listen=:8082
      - --trusted-key=admin=/keys/admin.pub
      - --vmd-url=http://vmd:8080
      - --agentd-url=http://agentd:8080
      - --default-project=${HOMECLOUD_DEFAULT_PROJECT:-default}
      - --default-image=${HOMECLOUD_DEFAULT_IMAGE:-}
      - --log-level=info
    volumes:
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:8082:8082"

  ollama:
    # Optional LLM server. Start it with: docker compose --profile llm up -d
    profiles: ["llm"]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  vmddata:
  ollama:
