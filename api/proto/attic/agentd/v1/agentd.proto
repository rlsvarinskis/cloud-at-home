syntax = "proto3";

// agentd: LLM agents. An agent is always tied to one VM (owned by vmd); many agents may share a VM.
package attic.agentd.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rlsvarinskis/cloud-at-home/api/gen/attic/agentd/v1;agentdv1";

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_ACTIVE = 1;
  AGENT_STATE_ORPHANED = 2;   // the VM disappeared (force-deleted); tasks fail until fixed
  AGENT_STATE_DELETING = 3;
}
message Agent {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string vm_id = 4;
  string model = 5;             // Ollama model name; no default, the creator chooses
  string system_prompt = 6;     // appended to the built-in system prompt
  string workdir = 7;           // directory in the VM this agent works in
  AgentState state = 8;
  map<string, string> labels = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
message CreateAgentRequest {
  string project_id = 1;
  string name = 2;
  string vm_id = 3;             // required; must exist in the same project
  string model = 4;             // required
  string system_prompt = 5;
  string workdir = 6;           // default /home/agent/agents/<agent id>
  map<string, string> labels = 7;
  string idempotency_key = 8;
}
message GetAgentRequest { string id = 1; }
message ListAgentsRequest {
  string project_id = 1;
  string vm_id = 2;             // optional filter
  int32 page_size = 3;
  string page_token = 4;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}
message UpdateAgentRequest {
  string id = 1;
  optional string model = 2;
  optional string system_prompt = 3;
}
message DeleteAgentRequest { string id = 1; }
message DeleteAgentResponse {}

service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;      // the agent (or check_command) says the goal was not met
  TASK_STATE_GAVE_UP = 5;     // no verdict / step limit reached
  TASK_STATE_CANCELLED = 6;
  TASK_STATE_ERROR = 7;       // infrastructure problem (VM gone, model error, ...)
  TASK_STATE_SUCCEEDED_UNVERIFIED = 8; // the model claimed success but no check_command verified it
}
message Task {
  string id = 1;
  string agent_id = 2;
  string project_id = 3;
  string prompt = 4;
  string check_command = 5;
  int32 max_steps = 6;
  TaskState state = 7;
  string verdict = 8;           // SUCCESS / FAILED / "" as stated by the model
  string result = 9;            // the final report
  int32 steps = 10;
  int32 attempts = 11;
  bool cancel_requested = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // Why the task ended or stopped early, for example "repetition", "token_limit", "step_limit", "timeout",
  // "check passed". Empty for an ordinary final report.
  string reason = 16;
  // Who decided the state: "check" (check_command ran) or "model" (the model's VERDICT line). Empty while the
  // task is queued or running and when no decision was made.
  string verdict_source = 17;
  int64 prompt_tokens = 18;       // prompt tokens the backend reported for completed model calls
  int64 completion_tokens = 19;   // generated tokens; an aborted call counts one per streamed chunk
  int32 model_calls = 20;         // model calls made so far (complete and aborted)
  int32 partial_calls = 21;       // model calls that were aborted before their final chunk
  double first_token_seconds = 22;    // seconds from start to the first streamed model output (0 = none yet)
  double first_command_seconds = 23;  // seconds from start to the first command (0 = none yet)
  // The model's partial answer so far (last ~600 characters) and its raw reasoning (last ~300 characters).
  // Set only while a model call is streaming, throttled to about one update per second, and cleared when
  // the call ends. They are never part of result.
  string live_answer = 24;
  string live_reasoning = 25;
  // The most recent model calls (at most 50), oldest first.
  repeated CallStat calls = 26;
  bool check_each_step = 27;      // run check_command after every batch of commands (default true at creation)
  int32 max_minutes = 28;         // 0 = no time limit
  int32 max_call_tokens = 29;     // per-reply token cap; 0 = no cap
}

// CallStat describes one model call of a task.
message CallStat {
  int32 index = 1;                // 1-based, dense per task
  double seconds = 2;
  int64 prompt_tokens = 3;
  int64 gen_tokens = 4;
  string end = 5;                 // "ok", "cancel", "timeout", "repetition", "length", "parse", "error"
  bool partial = 6;               // aborted before its final chunk: gen_tokens counts streamed chunks
  string note = 7;                // what the loop did about the call, for example a repaired tool call
}
message CreateTaskRequest {
  string agent_id = 1;
  string prompt = 2;
  string check_command = 3;     // run in the VM afterwards; exit 0 decides SUCCEEDED
  int32 max_steps = 4;          // default 40
  string idempotency_key = 5;
  optional bool check_each_step = 6;   // default true: run check_command after each batch of commands
  int32 max_minutes = 7;               // 0 (default) = no time limit; otherwise the task is cancelled after it
  optional int32 max_call_tokens = 8;  // per-reply token cap, default 32768; 0 = no cap
}
message GetTaskRequest {
  string id = 1;
  TaskState wait_for_not = 2;   // long-poll: return when the task leaves this state (e.g. RUNNING)
  int32 wait_seconds = 3;       // max 30
}
message ListTasksRequest {
  string agent_id = 1;
  string project_id = 2;        // one of agent_id / project_id
  TaskState state = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}
message CancelTaskRequest { string id = 1; }

message Step {
  int32 seq = 1;
  string command = 2;
  string output = 3;            // excerpt
  optional int32 exit_code = 4;
  google.protobuf.Timestamp at = 5;
}
message ListStepsRequest {
  string task_id = 1;
  int32 after_seq = 2;          // return only steps with seq greater than this (the cursor; 0 = from the start)
  int32 limit = 3;              // page size; 0 = the server's default, the server caps it at 500
}
message ListStepsResponse { repeated Step steps = 1; }

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (Task);
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);
}

message Model {
  string name = 1;
  int64 size_bytes = 2;
  double size_gib = 3;          // size_bytes in GiB
  string params = 4;            // parameter count as reported, for example "8.0B"; may be empty
  string quant = 5;             // quantisation, for example "Q4_K_M"; may be empty
  int64 context_length = 6;     // the model's context length; 0 when unknown
  // Whether the weights fit the configured VRAM budget (see agentd -vram-gib). This is a rough, weights-only
  // check: the KV cache and the runtime are not counted. A model that does not fit probably runs partly on the CPU.
  bool fits_vram = 7;
}
message ListModelsRequest {}
message ListModelsResponse { repeated Model models = 1; }

service ModelService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}
