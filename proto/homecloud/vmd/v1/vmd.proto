syntax = "proto3";

// vmd: virtual machines, disks, images and in-guest execution.
// Every resource belongs to a project; every RPC is authorized per project (see docs/ARCHITECTURE.md).
package homecloud.vmd.v1;

import "google/protobuf/timestamp.proto";

option go_package = "example.com/homecloud/gen/homecloud/vmd/v1;vmdv1";

// ---------------------------------------------------------------------------------------------
// Virtual machines
// ---------------------------------------------------------------------------------------------

// What the user wants; the reconciler drives the observed state towards it.
enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_STATE_RUNNING = 1;
  POWER_STATE_STOPPED = 2;
}

// What is observed.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_PENDING = 1;   // created, not yet placed on a node / disks not ready
  VM_STATE_STOPPED = 2;
  VM_STATE_STARTING = 3;
  VM_STATE_RUNNING = 4;
  VM_STATE_STOPPING = 5;
  VM_STATE_ERROR = 6;     // see state_reason
  VM_STATE_DELETING = 7;
}

message VM {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string node_id = 4;
  int32 cpus = 5;
  int64 memory_mb = 6;
  repeated string disk_ids = 7;   // first disk is the boot disk
  PowerState desired_state = 8;
  VMState state = 9;
  string state_reason = 10;       // why the VM is in ERROR / was stopped unexpectedly
  repeated string holds = 11;     // other services (e.g. agentd) that need this VM; blocks deletion
  map<string, string> labels = 12;
  int64 generation = 13;          // bumped on every spec change
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateVMRequest {
  string project_id = 1;
  string name = 2;
  int32 cpus = 3;
  int64 memory_mb = 4;
  oneof boot {
    string image_id = 5;   // creates a new boot disk from this image
    string disk_id = 6;    // uses an existing, detached disk
  }
  int32 disk_size_gb = 7;  // for image_id: size of the new boot disk
  map<string, string> labels = 8;
  bool start = 9;          // desired_state = RUNNING from the beginning
  string idempotency_key = 10;
}
message GetVMRequest {
  string id = 1;
  // Long-poll: block until the VM reaches this state (or wait_seconds, max 30 passes).
  VMState wait_for_state = 2;
  int32 wait_seconds = 3;
}
message ListVMsRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  map<string, string> label_selector = 4;
}
message ListVMsResponse {
  repeated VM vms = 1;
  string next_page_token = 2;
}
message UpdateVMRequest {
  string id = 1;
  optional int32 cpus = 2;          // resizing requires the VM to be STOPPED
  optional int64 memory_mb = 3;
  bool replace_labels = 4;
  map<string, string> labels = 5;
  int64 expected_generation = 6;    // 0 = don't check (optimistic concurrency)
}
message StartVMRequest { string id = 1; }
message StopVMRequest {
  string id = 1;
  bool force = 2;   // skip the graceful guest shutdown
}
message DeleteVMRequest {
  string id = 1;
  bool force = 2;           // delete even if holds exist
  bool delete_disks = 3;    // also delete the VM's disks
}
message DeleteVMResponse {}
message HoldRequest {
  string id = 1;
  string holder = 2;        // e.g. "agentd/agent-01H..."
}

service VMService {
  rpc CreateVM(CreateVMRequest) returns (VM);
  rpc GetVM(GetVMRequest) returns (VM);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);
  rpc UpdateVM(UpdateVMRequest) returns (VM);
  rpc StartVM(StartVMRequest) returns (VM);
  rpc StopVM(StopVMRequest) returns (VM);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);
  rpc AddHold(HoldRequest) returns (VM);
  rpc RemoveHold(HoldRequest) returns (VM);
}

// ---------------------------------------------------------------------------------------------
// Images and disks
// ---------------------------------------------------------------------------------------------

enum ImageState {
  IMAGE_STATE_UNSPECIFIED = 0;
  IMAGE_STATE_CREATING = 1;
  IMAGE_STATE_READY = 2;
  IMAGE_STATE_ERROR = 3;
  IMAGE_STATE_DELETING = 4;
}
message Image {
  string id = 1;
  string project_id = 2;       // empty = shared by all projects (read-only for them)
  string name = 3;
  string node_id = 4;          // node that holds the file
  ImageState state = 5;
  int64 size_bytes = 6;
  string source_disk_id = 7;   // set for snapshots
  google.protobuf.Timestamp created_at = 8;
  string state_reason = 9;     // why the image is in ERROR
}
message RegisterImageRequest {
  string project_id = 1;       // empty requires the global admin role
  string name = 2;
  string node_id = 3;
  string path = 4;             // existing qcow2 on the node (admin only)
}
message GetImageRequest { string id = 1; }
message ListImagesRequest {
  string project_id = 1;       // lists the project's images plus shared ones
  int32 page_size = 2;
  string page_token = 3;
}
message ListImagesResponse {
  repeated Image images = 1;
  string next_page_token = 2;
}
message DeleteImageRequest { string id = 1; }
message DeleteImageResponse {}

service ImageService {
  rpc RegisterImage(RegisterImageRequest) returns (Image);
  rpc GetImage(GetImageRequest) returns (Image);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
}

enum DiskState {
  DISK_STATE_UNSPECIFIED = 0;
  DISK_STATE_CREATING = 1;
  DISK_STATE_READY = 2;
  DISK_STATE_ERROR = 3;
  DISK_STATE_DELETING = 4;
}
message Disk {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string node_id = 4;
  int32 size_gb = 5;
  string image_id = 6;         // backing image, if any
  DiskState state = 7;
  string attached_vm_id = 8;
  google.protobuf.Timestamp created_at = 9;
  string state_reason = 10;    // why the disk is in ERROR
}
message CreateDiskRequest {
  string project_id = 1;
  string name = 2;
  string image_id = 3;         // optional: copy-on-write overlay of this image
  int32 size_gb = 4;
  string node_id = 5;          // optional placement hint when there is no image
}
message GetDiskRequest { string id = 1; }
message ListDisksRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListDisksResponse {
  repeated Disk disks = 1;
  string next_page_token = 2;
}
message ResizeDiskRequest {
  string id = 1;
  int32 size_gb = 2;           // grow only
}
message DeleteDiskRequest { string id = 1; }
message DeleteDiskResponse {}
message SnapshotDiskRequest {
  string id = 1;               // the disk must be detached or its VM stopped
  string image_name = 2;
}

service DiskService {
  rpc CreateDisk(CreateDiskRequest) returns (Disk);
  rpc GetDisk(GetDiskRequest) returns (Disk);
  rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);
  rpc ResizeDisk(ResizeDiskRequest) returns (Disk);
  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse);
  rpc SnapshotDisk(SnapshotDiskRequest) returns (Image);
}

// ---------------------------------------------------------------------------------------------
// Execution inside a VM. Jobs never block a call for more than 30 s; long ones are polled.
// ---------------------------------------------------------------------------------------------

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_SUCCEEDED = 2;   // exit code 0
  JOB_STATE_FAILED = 3;      // non-zero exit code
  JOB_STATE_CANCELLED = 4;
  JOB_STATE_TIMED_OUT = 5;
  JOB_STATE_LOST = 6;        // the VM stopped or the process vanished without an exit code
}
message Job {
  string id = 1;
  string vm_id = 2;
  string project_id = 3;
  string command = 4;
  string workdir = 5;
  JobState state = 6;
  optional int32 exit_code = 7;
  int32 timeout_seconds = 8;
  string killed_reason = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}
message JobOutput {
  Job job = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  int64 stdout_offset = 4;     // pass back to continue
  int64 stderr_offset = 5;
  bool truncated = 6;          // earlier output was omitted (tail mode)
  bool more = 7;               // more output is waiting (offset mode)
}
message StartJobRequest {
  string vm_id = 1;
  string command = 2;          // run with `bash -lc`
  string workdir = 3;          // default: the agent user's home
  int32 timeout_seconds = 4;   // total lifetime of the command (default 3600)
  int32 wait_seconds = 5;      // how long this call may wait for completion (max 30)
  int32 max_output = 6;        // bytes per stream, default 8192
  string idempotency_key = 7;
}
message PollJobRequest {
  string job_id = 1;
  int32 wait_seconds = 2;
  int64 stdout_offset = 3;
  int64 stderr_offset = 4;
  int32 max_output = 5;
  bool tail = 6;               // return the LAST max_output bytes instead of reading from the offsets
}
message CancelJobRequest { string job_id = 1; }
message ListJobsRequest {
  string vm_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}
message PutFileRequest {
  string vm_id = 1;
  string path = 2;
  bytes content = 3;           // up to 8 MiB
  uint32 mode = 4;             // default 0644
}
message PutFileResponse {}
message GetFileRequest {
  string vm_id = 1;
  string path = 2;
  int64 max_bytes = 3;         // default and maximum 8 MiB
}
message GetFileResponse {
  bytes content = 1;
  bool truncated = 2;
}

service ExecService {
  rpc StartJob(StartJobRequest) returns (JobOutput);
  rpc PollJob(PollJobRequest) returns (JobOutput);
  rpc CancelJob(CancelJobRequest) returns (JobOutput);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc PutFile(PutFileRequest) returns (PutFileResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
}

// ---------------------------------------------------------------------------------------------
// Metrics
// ---------------------------------------------------------------------------------------------

// One filesystem inside the guest, attributed to the VM disk it lives on.
message GuestFilesystem {
  string disk_id = 1;          // which VM disk holds it ("" if it cannot be attributed)
  string device = 2;           // e.g. /dev/vda1
  string mount_point = 3;
  int64 size_bytes = 4;
  int64 used_bytes = 5;
}
// Host-side view of a disk image: thin-provisioned, so allocation differs from size.
message DiskAllocation {
  string disk_id = 1;
  int64 virtual_size_bytes = 2;
  int64 allocated_bytes = 3;   // what the qcow2 file really occupies on the host
}
message VMMetrics {
  string vm_id = 1;
  google.protobuf.Timestamp sampled_at = 2;
  // Measured inside the guest.
  double cpu_percent = 3;      // like top: 100 per busy vCPU, so 0..100*cpu_cores (an 8-vCPU guest can show 800)
  int32 cpu_cores = 4;
  double load1 = 5;
  double load5 = 6;
  double load15 = 7;
  int64 mem_total_bytes = 8;
  int64 mem_used_bytes = 9;
  int64 mem_available_bytes = 10;
  int64 swap_total_bytes = 11;
  int64 swap_used_bytes = 12;
  int64 uptime_seconds = 13;
  repeated GuestFilesystem filesystems = 14;
  repeated DiskAllocation disks = 15;
}
message GetVMMetricsRequest { string vm_id = 1; }

message NodeCapacity {
  string node_id = 1;
  string state = 2;            // ready / draining / down
  int32 cpus_total = 3;
  int32 cpus_allocated = 4;    // vCPUs of VMs that should be running
  int32 cpus_available = 5;    // after the overcommit factor
  int64 memory_mb_total = 6;
  int64 memory_mb_allocated = 7;
  int64 memory_mb_available = 8;
  int64 disk_bytes_total = 9;
  int64 disk_bytes_free = 10;
  int32 vms_total = 11;
  int32 vms_running = 12;
  google.protobuf.Timestamp last_heartbeat = 13;
}
message GetCapacityRequest {}
message GetCapacityResponse {
  repeated NodeCapacity nodes = 1;
  NodeCapacity total = 2;      // sums over ready nodes (node_id "*")
}

message SetNodeDrainingRequest {
  string node_id = 1;
  bool draining = 2;
}

// Operator actions on the fleet (global, not project-scoped).
service ClusterService {
  // Stop (draining=true) or resume (false) placing new VM starts on a node. VMs already running there keep
  // running; stopped VMs on it wait until it is undrained. The decision survives outages and restarts.
  rpc SetNodeDraining(SetNodeDrainingRequest) returns (NodeCapacity);
}

service MetricsService {
  // Per-VM metrics: needs the VM to be running.
  rpc GetVMMetrics(GetVMMetricsRequest) returns (VMMetrics);
  // Cluster capacity for operators: global (not project-scoped).
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);
}
